<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bate-architecture-title bate-architecture-desc" id="bate-architecture-root">
<title id="bate-architecture-title">Bate architecture</title>
<desc id="bate-architecture-desc">The window, other devices and chat apps all talk to the appd background service, which stores state in app.db and the Keychain, runs one sandboxed agentcore engine per bot, and drives Chrome, Bate Helper and Apple apps; the engine calls the model, MCP connectors and an optional installed agent.</desc>
<defs>
      <style>#bate-architecture-root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; color: #1f2328; }
      #bate-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#bate-architecture-root .diagram-container { overflow-x: visible; }
}</style>
