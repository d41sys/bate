name: ci

on:
  push:
    branches: [main]
    tags: ["v*", "wp-*"]
  pull_request:

jobs:
  check:
    runs-on: macos-latest # the service is macOS-only (launchd); the toolchain comes from rust-toolchain.toml
    steps:
      - uses: actions/checkout@v7
      # The window's page is built first: the shell takes its files in at compile time.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci && npm run build && npm test
        working-directory: window/ui
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # The engine alone also builds for Linux: benchmark tasks run it inside Linux containers.
  engine-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo build -p agentcore --locked

  # A `v*` tag publishes `Bate.app` as a GitHub release, signed ad hoc (a Developer ID signature
  # and notarisation need an Apple account: see `window/bundle.sh`), and with the
  # `BATE_UPDATE_KEY` secret set, the update feed for it.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The tag is the version the running programs report; if the two differ, an updated
      # app would be offered the same release again.
      - run: grep -qx "version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml
      # Builds the page, the programs and the app, and signs it. The public half of the update key
      # is compiled in (unset: the app does not update itself).
      - run: window/bundle.sh
        env:
          BATE_UPDATE_PUBKEY: ${{ vars.BATE_UPDATE_PUBKEY }}
      # COPYFILE_DISABLE: no `._` files for extended attributes, which the signature does not cover.
      - run: tar -czf "bate-$GITHUB_REF_NAME-macos-arm64.tar.gz" -C target/release Bate.app
        env:
          COPYFILE_DISABLE: 1
      # With a signing key, the release also carries the feed that installed apps read.
      - run: |
          files=(bate-*.tar.gz)
          if [ -n "$BATE_UPDATE_KEY" ]; then
            target/release/appd update sign "${files[0]}" "${GITHUB_REF_NAME#v}" > feed.json
            files+=(feed.json)
          fi
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          BATE_UPDATE_KEY: ${{ secrets.BATE_UPDATE_KEY }}

  # A `wp-<name>-v<version>` tag publishes the workplace `workplaces/<name>/` as a release asset
  # that `catalog/workplaces.json` points at. The archive is packed by the script that made the
  # entry's size and hash, and must equal them. The release is a prerelease, which GitHub never
  # takes as the latest one (`--latest=false` alone does not hold while it is the only release):
  # the updater reads `releases/latest/download/feed.json`, which only a `v*` release may own.
  workplace:
    if: startsWith(github.ref, 'refs/tags/wp-')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: |
          rest=${GITHUB_REF_NAME#wp-}
          name=${rest%-v*}
          version=${rest##*-v}
          file="$name-$version.tar.gz"
          read -r size sha < <(python3 workplaces/pack.py "workplaces/$name" "$file")
          want="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$file"
          jq -e --arg n "$name" --arg v "$version" --arg s "$size" --arg h "$sha" --arg u "$want" \
            '.workplaces[] | select(.name == $n and .version == $v and .url == $u and (.size | tostring) == $s and .sha256 == $h)' \
            catalog/workplaces.json
          test "$(jq -r .version "workplaces/$name/workplace.json")" = "$version"
          gh release create "$GITHUB_REF_NAME" "$file" --prerelease --verify-tag \
            --title "Workplace $name $version" --notes "The workplace $name $version, pinned by catalog/workplaces.json (size $size, sha256 $sha)."
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          test "$latest" != "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
