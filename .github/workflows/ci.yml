name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    runs-on: macos-latest # the service is macOS-only (launchd); the toolchain comes from rust-toolchain.toml
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # A `v*` tag publishes the two programs as a GitHub release. Unsigned until #37.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release --locked -p appd -p agentcore
      - run: tar -czf "bate-$GITHUB_REF_NAME-macos-arm64.tar.gz" -C target/release appd agentcore
      - run: gh release create "$GITHUB_REF_NAME" bate-*.tar.gz --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
